services:
  postgres:
    image: postgres:16-alpine
    container_name: air-quality-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airquality
      POSTGRES_PASSWORD: airquality_dev
      POSTGRES_DB: airquality

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airquality -d airquality"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: